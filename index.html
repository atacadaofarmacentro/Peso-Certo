<div class="field full">
  <label for="nascimento">Data de nascimento</label>
  <input id="nascimento" type="date"
    min="1900-01-01" required>
</div>

<div class="field">
  <label for="sexo">Sexo para referência do IMC</label>
  <select id="sexo" required>
    <option value="">Selecione</option>
    <option value="male">Masculino</option>
    <option value="female">Feminino</option>
  </select>
</div>

<div class="field">
  <label for="peso">Peso em kg</label>
  <input id="peso" type="number" min="20" max="350"
    step="0.1" placeholder="Ex.: 75" required>
</div>

<div class="field full">
  <label for="altura">Altura em centímetros</label>
  <input id="altura" type="number" min="100" max="250"
    placeholder="Ex.: 170" required>
</div>
